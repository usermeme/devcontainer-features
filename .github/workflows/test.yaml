name: "Test Features"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every feature is self-contained (no shared library), so the safety rules live here.
      - name: "Forbidden patterns (777, curl | sh)"
        run: |
          if grep -rnE '^[^#]*(chmod (-R )?[0-7]?777|curl[^|#]*\|[[:space:]]*(ba)?sh)' src; then
            echo "::error::world-writable permissions or piping a download into a shell"
            exit 1
          fi

      - name: "Downloads are HTTPS-only"
        run: |
          if grep -rnE '^[^#]*\bcurl -' src | grep -vF -- "--proto '=https'"; then
            echo "::error::every curl call must pass --proto '=https' --tlsv1.2 (a redirect to plain http would let anyone on the network swap the download)"
            exit 1
          fi

      - name: "Feature version bumped when its files change"
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          status=0
          for dir in $(git diff --name-only FETCH_HEAD -- src/ ':(exclude)src/*/*.md' | cut -d/ -f2 | sort -u); do
            [ -f "src/$dir/devcontainer-feature.json" ] || continue
            old="$(git show "FETCH_HEAD:src/$dir/devcontainer-feature.json" 2>/dev/null | jq -r .version || true)"
            new="$(jq -r .version "src/$dir/devcontainer-feature.json")"
            if [ -n "$old" ] && [ "$old" = "$new" ]; then
              echo "::error::src/$dir changed but its version is still $new; publishing skips existing versions, so the change would never ship"
              status=1
            fi
          done
          exit $status

      - name: "ShellCheck (errors)"
        run: shellcheck -S error src/*/*.sh

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      # Report every feature's result, not just the first failure
      fail-fast: false
      matrix:
        include:
          - feature: worktree
            args: --skip-autogenerated
          - feature: dotfiles
          - feature: pnpm
          - feature: yarn
            args: --skip-autogenerated
          - feature: antigravity
          - feature: opencode
          - feature: cline
          - feature: kilocode
          - feature: neovim
          - feature: node-modules-volume
          - feature: github
    name: test (${{ matrix.feature }})
    steps:
      - uses: actions/checkout@v7

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Prepare test environment"
        run: |
          # Feature mounts need these host paths to exist (see each feature's NOTES.md).
          mkdir -p "$HOME/dotfiles" "$HOME/.gemini" "$HOME/.agents/skills" "$HOME/.config/gcloud"
          mkdir -p "$HOME/.config/opencode"
          mkdir -p "$HOME/.cline/data/settings"
          mkdir -p "$HOME/.config/kilo"
          # Create mock package in dotfiles for testing
          mkdir -p "$HOME/dotfiles/mockpkg/.config"
          touch "$HOME/dotfiles/mockpkg/.config/mock.conf"
          # Mock cline package: apply-dotfiles must stow it with a folded hooks directory
          mkdir -p "$HOME/dotfiles/cline/.cline/hooks"
          printf '#!/usr/bin/env bash\necho "{}"\n' > "$HOME/dotfiles/cline/.cline/hooks/PostToolUse"
          chmod +x "$HOME/dotfiles/cline/.cline/hooks/PostToolUse"

      - name: "Test ${{ matrix.feature }}"
        run: devcontainer features test --project-folder . ${{ matrix.args }} -f ${{ matrix.feature }}
