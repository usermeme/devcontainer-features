name: "Test Features"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Shared library copies are in sync"
        run: |
          scripts/sync-lib.sh
          git diff --exit-code -- src/ || { echo "::error::src/*/common.sh drifted from lib/common.sh; run scripts/sync-lib.sh"; exit 1; }

      - name: "Forbidden patterns (777, curl | sh)"
        run: |
          if grep -rnE '^[^#]*(chmod (-R )?[0-7]?777|curl[^|#]*\|[[:space:]]*(ba)?sh)' src lib; then
            echo "::error::world-writable permissions or piping a download into a shell"
            exit 1
          fi

      - name: "ShellCheck (errors)"
        run: shellcheck -x -S error lib/*.sh scripts/*.sh src/*/*.sh

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      # Report every feature's result, not just the first failure
      fail-fast: false
      matrix:
        include:
          - feature: worktree
            args: --skip-autogenerated
          - feature: dotfiles
          - feature: pnpm
          - feature: yarn
            args: --skip-autogenerated
          - feature: antigravity
          - feature: opencode
          - feature: neovim
          - feature: node-modules-volume
    name: test (${{ matrix.feature }})
    steps:
      - uses: actions/checkout@v7

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Prepare test environment"
        run: |
          # Feature mounts need these host paths to exist (see each feature's NOTES.md).
          mkdir -p "$HOME/dotfiles" "$HOME/.gemini" "$HOME/.agents/skills" "$HOME/.config/gcloud"
          mkdir -p "$HOME/.config/opencode" "$HOME/.local/share/opencode"
          # Create mock package in dotfiles for testing
          mkdir -p "$HOME/dotfiles/mockpkg/.config"
          touch "$HOME/dotfiles/mockpkg/.config/mock.conf"

      - name: "Test ${{ matrix.feature }}"
        run: devcontainer features test --project-folder . ${{ matrix.args }} -f ${{ matrix.feature }}
